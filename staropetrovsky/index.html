<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Старопетровский пр-д, 10Б в AR</title>
<meta name="theme-color" content="#77298C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{--purple:#77298C;--ink:#1B1B2F;--paper:#F3F4F8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:20px 20px 8px}
h1{margin:0;font-size:24px;line-height:1.2;font-weight:800}
header p{margin:6px 0 0;font-size:14px;color:#4B516C}
main{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 12px}
model-viewer{flex:1;width:100%;min-height:340px;background:#fff;border-radius:20px;--poster-color:#fff}
#ar-btn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--purple);color:#fff;border:0;border-radius:999px;padding:14px 26px;font:800 16px Manrope,system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(119,41,140,.35)}
#ar-btn:active{opacity:.85}
.hint{margin:12px 8px 0;font-size:14px;line-height:1.4}
.na{display:none;margin:8px;font-size:13px;color:#4B516C}
footer{padding:12px 20px 16px;font-size:12px;color:#4B516C}
</style>
</head>
<body>
<header>
<h1>Старопетровский пр-д, 10Б в AR</h1>
<p>Макет района в радиусе 1 км, масштаб около 1:2000. Фиолетовый пин — дом.</p>
</header>
<main>
<model-viewer id="mv" src="model.glb" ios-src="model.usdz" alt="3D-макет района вокруг Старопетровского пр-да, 10Б"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
  camera-controls auto-rotate shadow-intensity="1" exposure="0.8" interaction-prompt="none" shadow-softness="0.8"
  camera-orbit="30deg 55deg auto" touch-action="pan-y" loading="eager">
  <button slot="ar-button" id="ar-btn">Открыть в AR</button>
</model-viewer>
<p class="hint">Наведите телефон на стол/пол и двигайтесь медленно.</p>
<p class="na" id="na">AR на этом устройстве недоступен. Модель можно вращать пальцем.</p>
</main>
<footer>© участники OpenStreetMap (ODbL)</footer>
<script>
document.getElementById('mv').addEventListener('load',function(){
  var mv=this;setTimeout(function(){if(!mv.canActivateAR)document.getElementById('na').style.display='block'},300)});
</script>
</body>
</html>
